<!doctype html><html lang="id"><meta charset="utf-8"><title>Silent Route — Expansion</title><style>body{margin:36px;background:#ece7dc;color:#2b2a33;font:16px system-ui}main{max-width:1400px;margin:auto}h1{font:42px Georgia}section{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}figure{margin:0;padding:12px;background:#faf7ee}figure img{width:100%;height:340px;object-fit:contain}figcaption{padding:10px}a{color:#426b6e}.scene{position:relative;aspect-ratio:16/9;overflow:hidden}.scene img{position:absolute;width:104%;height:104%;object-fit:cover;left:-2%;top:-2%}.near{transition:transform .08s linear}@media(max-width:800px){section{grid-template-columns:1fr}}</style><main><h1>Jalur Senyap / Expansion</h1><p>Maruani · Environment isometrik dan top-down · Background dan parallax · UI lima bangsa</p><p><a href="BACA-DULU.txt">Panduan penggunaan dan batas teknis</a> · <a href="prompts.json">Prompt lengkap</a></p><section><figure><img loading="lazy" src="characters/maruani-turnaround.png"><figcaption>characters/maruani-turnaround.png</figcaption></figure><figure><img loading="lazy" src="portraits/maruani.png"><figcaption>portraits/maruani.png</figcaption></figure><figure><img loading="lazy" src="environment/isometric/asharim-iso.png"><figcaption>environment/isometric/asharim-iso.png</figcaption></figure><figure><img loading="lazy" src="environment/topdown/asharim-topdown.png"><figcaption>environment/topdown/asharim-topdown.png</figcaption></figure><figure><img loading="lazy" src="backgrounds/asharim-far.png"><figcaption>backgrounds/asharim-far.png</figcaption></figure><figure><img loading="lazy" src="parallax/asharim-foreground.png"><figcaption>parallax/asharim-foreground.png</figcaption></figure><figure><img loading="lazy" src="environment/isometric/cirusia-iso.png"><figcaption>environment/isometric/cirusia-iso.png</figcaption></figure><figure><img loading="lazy" src="environment/topdown/cirusia-topdown.png"><figcaption>environment/topdown/cirusia-topdown.png</figcaption></figure><figure><img loading="lazy" src="backgrounds/cirusia-far.png"><figcaption>backgrounds/cirusia-far.png</figcaption></figure><figure><img loading="lazy" src="parallax/cirusia-foreground.png"><figcaption>parallax/cirusia-foreground.png</figcaption></figure><figure><img loading="lazy" src="environment/isometric/tseren-iso.png"><figcaption>environment/isometric/tseren-iso.png</figcaption></figure><figure><img loading="lazy" src="environment/topdown/tseren-topdown.png"><figcaption>environment/topdown/tseren-topdown.png</figcaption></figure><figure><img loading="lazy" src="backgrounds/tseren-far.png"><figcaption>backgrounds/tseren-far.png</figcaption></figure><figure><img loading="lazy" src="parallax/tseren-foreground.png"><figcaption>parallax/tseren-foreground.png</figcaption></figure><figure><img loading="lazy" src="environment/isometric/bahtari-iso.png"><figcaption>environment/isometric/bahtari-iso.png</figcaption></figure><figure><img loading="lazy" src="environment/topdown/bahtari-topdown.png"><figcaption>environment/topdown/bahtari-topdown.png</figcaption></figure><figure><img loading="lazy" src="backgrounds/bahtari-far.png"><figcaption>backgrounds/bahtari-far.png</figcaption></figure><figure><img loading="lazy" src="parallax/bahtari-foreground.png"><figcaption>parallax/bahtari-foreground.png</figcaption></figure><figure><img loading="lazy" src="environment/isometric/lulanai-iso.png"><figcaption>environment/isometric/lulanai-iso.png</figcaption></figure><figure><img loading="lazy" src="environment/topdown/lulanai-topdown.png"><figcaption>environment/topdown/lulanai-topdown.png</figcaption></figure><figure><img loading="lazy" src="backgrounds/lulanai-far.png"><figcaption>backgrounds/lulanai-far.png</figcaption></figure><figure><img loading="lazy" src="parallax/lulanai-foreground.png"><figcaption>parallax/lulanai-foreground.png</figcaption></figure><figure><img loading="lazy" src="ui/ui-lima-bangsa.png"><figcaption>ui/ui-lima-bangsa.png</figcaption></figure></section><h1>Pratinjau parallax</h1><p>Gerakkan pointer di atas gambar untuk melihat pemisahan layer.</p><h2>Asharim</h2><div class="scene"><img src="backgrounds/asharim-far.png"><img class="near" src="parallax/asharim-foreground.png"></div><h2>Cirusia</h2><div class="scene"><img src="backgrounds/cirusia-far.png"><img class="near" src="parallax/cirusia-foreground.png"></div><h2>Tseren</h2><div class="scene"><img src="backgrounds/tseren-far.png"><img class="near" src="parallax/tseren-foreground.png"></div><h2>Bahtari</h2><div class="scene"><img src="backgrounds/bahtari-far.png"><img class="near" src="parallax/bahtari-foreground.png"></div><h2>Lulanai</h2><div class="scene"><img src="backgrounds/lulanai-far.png"><img class="near" src="parallax/lulanai-foreground.png"></div></main><script>document.querySelectorAll('.scene').forEach(s=>{s.onpointermove=e=>{const r=s.getBoundingClientRect();s.querySelector('.near').style.transform=`translate(${(e.clientX-r.left-r.width/2)*.025}px,${(e.clientY-r.top-r.height/2)*.015}px)`};s.onpointerleave=()=>s.querySelector('.near').style.transform='none'})</script></html>
